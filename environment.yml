# conda environment for the analysis/reporting layer of scfm-benchmark.
# Foundation-model embedding generation uses dedicated per-FM HPCC envs
# (scgpt_finetune, state_env, scpeft_env, scprint2_env) — NOT this env.
# See docs/tooling-reference.md and configs/hpcc.yaml.
name: scfm-benchmark
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - numpy>=1.23
  - pandas>=1.5
  - scipy>=1.9
  - scikit-learn>=1.5
  - matplotlib>=3.6
  - seaborn>=0.12
  - h5py>=3.8
  - statsmodels>=0.14
  - anndata>=0.10
  - scanpy>=1.11
  - pyyaml>=6.0
  - joblib>=1.2
  - tqdm>=4.65
  - pip
  - pip:
      - -e .[dev]
