name: Portable package demo

on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'pyproject.toml', 'README.md', 'LICENSE', 'tests/conftest.py', 'tests/test_portable_benchmark.py', '.github/workflows/package-demo.yml']
  pull_request:
    paths: ['src/**', 'pyproject.toml', 'README.md', 'LICENSE', 'tests/conftest.py', 'tests/test_portable_benchmark.py', '.github/workflows/package-demo.yml']

permissions:
  contents: read

jobs:
  wheel-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel
        run: python -m pip install dist/*.whl pytest
      - name: Test from outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -c "from pathlib import Path; import scfm_benchmark; assert 'site-packages' in str(Path(scfm_benchmark.__file__)); print(scfm_benchmark.__file__)"
          python -m pytest "$GITHUB_WORKSPACE/tests/test_portable_benchmark.py"
          scfm-bench demo --out "$RUNNER_TEMP/package-demo"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-and-synthetic-demo
          path: |
            dist/
            ${{ runner.temp }}/package-demo/
