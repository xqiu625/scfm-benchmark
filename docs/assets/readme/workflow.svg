    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526477" x="41.04" y="266.230406" transform="rotate(-0 41.04 266.230406)">Frozen embedding CSVs</text>
   </g>
   <g id="text_10">
