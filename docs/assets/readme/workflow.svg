   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b44" x="28.8" y="67.116562" transform="rotate(-0 28.8 67.116562)">From frozen embeddings to donor-level evaluation</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526477" x="28.8" y="94.078125" transform="rotate(-0 28.8 94.078125)">One set of cells. Shared folds. Inspectable predictions.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087e8b" x="41.04" y="149.478281" transform="rotate(-0 41.04 149.478281)">01</text>
   </g>
   <g id="text_5">
